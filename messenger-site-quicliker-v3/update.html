<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Обновление</title>
<style>
:root{--bg:#0b0b10;--t:#fff;--m:#9a9aaa;--a:#ff3d9a}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--t);font:16px/1.5 system-ui,sans-serif;padding:24px;text-align:center}
.box{width:min(420px,100%)}
h1{font-size:24px;margin-bottom:8px}
p{color:var(--m);margin:8px 0}
.bar{width:100%;height:5px;border-radius:5px;background:#ffffff1f;overflow:hidden;margin:22px 0}
.bar i{display:block;height:100%;width:40%;background:var(--a);animation:run 1s linear infinite}
@keyframes run{from{transform:translateX(-100%)}to{transform:translateX(260%)}}
.btn{display:inline-block;margin:6px;padding:12px 18px;border-radius:12px;background:var(--a);color:#fff;text-decoration:none;font-weight:600;border:0;font:inherit;cursor:pointer}
.btn.g{background:#ffffff1f}
.err{color:#ff7a7a}
</style>
</head>
<body>
<div class="box">
  <h1>Доступно обновление</h1>
  <p id="msg">Загружаем новую версию…</p>
  <div class="bar"><i></i></div>
  <p id="ver"></p>
  <div id="btns"></div>
</div>
<script>
const q=new URLSearchParams(location.search);
const to=q.get("to")||"",v=q.get("v")||"",from=q.get("from")||"",force=q.get("force")==="1";
const ok=/^https?:\/\//.test(to);
const go=()=>{location.replace(to+(to.includes("?")?"&":"?")+"updated="+encodeURIComponent(v))};
if(!ok){
  document.getElementById("msg").innerHTML='<span class="err">Адрес обновления не задан.</span>';
  document.querySelector(".bar").remove();
}else{
  document.getElementById("ver").textContent="Версия "+v;
  const b=document.getElementById("btns");
  b.innerHTML='<button class="btn" id="now">Перейти сейчас</button>'+(force?"":'<a class="btn g" id="stay" href="#">Продолжить в текущей версии</a>');
  document.getElementById("now").onclick=go;
  if(!force)document.getElementById("stay").href=from+(from.includes("?")?"&":"?")+"noupd="+encodeURIComponent(v);
  setTimeout(go,2500);
}
</script>
</body>
</html>
