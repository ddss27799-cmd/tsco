if(k==='coin'){const r=rnd(2)?'h':'t';mult=r===o?1.95:0;fin=r==='h'?'🦅 Орёл':'🪙 Решка';fr=()=>['🦅','🪙'][rnd(2)]}

const MIME={html:'text/html',js:'text/javascript',css:'text/css',json:'application/json',webmanifest:'application/manifest+json',svg:'image/svg+xml',txt:'text/plain',png:'image/png',jpg:'image/jpeg',jpeg:'image/jpeg',webp:'image/webp',gif:'image/gif',ico:'image/x-icon'};
const TEXT_EXT=/^(html|js|css|json|webmanifest|svg|txt)$/;
async function loadJSZip(){
  if(window.JSZip)return;
  await new Promise((ok,err)=>{const s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js';s.onload=ok;s.onerror=()=>err(new Error('Не удалось загрузить распаковщик zip (нужен интернет)'));document.head.append(s)});
}
async function readBundle(file){
  await loadJSZip();
  const z=await JSZip.loadAsync(file);
  const names=Object.keys(z.files).filter(n=>!z.files[n].dir);
  const entry=names.find(n=>/(^|\/)app\.html$/.test(n));
  if(!entry)throw new Error('В архиве нет app.html');
  const base=entry.slice(0,entry.length-'app.html'.length);
  const files={};
  for(const n of names){
    if(!n.startsWith(base))continue;
    const rel=n.slice(base.length);
    if(!rel||/^netlify(\/|\.toml$)/.test(rel)||/^node_modules\//.test(rel)||rel==='sw.js'||rel==='package.json'||/^README/i.test(rel))continue;
    const ext=(rel.split('.').pop()||'').toLowerCase();
    if(TEXT_EXT.test(ext))files[rel]=await z.file(n).async('string');
    else if(MIME[ext])files[rel]='data:'+MIME[ext]+';base64,'+await z.file(n).async('base64');
  }
  if(!files['index.html'])throw new Error('В архиве нет index.html');
  const size=Object.values(files).reduce((a,b)=>a+b.length,0);
  if(size>5000000)throw new Error('Архив слишком большой (лимит около 5 МБ после распаковки)');
  return files;
}

let bvBusy=0,bvFailAt=0;
async function bundleCheck(){
  const bv=S&&S.bv;
  if(!bv||bvBusy||call||LS.get('tsm_bv')===bv||!('caches' in window))return;
  if(Date.now()-bvFailAt<60000)return;
  bvBusy=1;
  try{
    const cname='tsm-bundle-'+bv;
    if(!(await caches.has(cname))){
      const b=await (await fetch(API+'?a=bundle',{cache:'no-store'})).json();
      if(!b||b.v!==bv)throw new Error('bundle mismatch');
      const c=await caches.open(cname),base=new URL('./',location.href).href;
      for(const [p,d] of Object.entries(b.files)){
        const body=d.startsWith('data:')?await (await fetch(d)).blob():d;
        await c.put(new URL(p,base).href,new Response(body,{headers:{'content-type':MIME[p.split('.').pop().toLowerCase()]||'text/html'}}));
      }
    }
    LS.set('tsm_bv',bv);
    for(const k of await caches.keys())if(k!==cname)await caches.delete(k);
    location.reload();
  }catch(e){bvFailAt=Date.now()}finally{bvBusy=0}
}

const peers={},lastTry={};
const pdc=n=>{const p=peers[n];return p&&p.dc&&p.dc.readyState==='open'?p.dc:null};
function newPeer(n,init){const old=peers[n];if(old){try{old.pc.close()}catch{}}
const pc=new RTCPeerConnection(ICE),P=peers[n]={pc,dc:null,q:[]};
pc.onicecandidate=e=>{if(e.candidate)sig(n,{t:'pice',c:e.candidate})};
pc.onconnectionstatechange=()=>{if(pc.connectionState==='failed'&&peers[n]===P)P.dc=null};
pc.ondatachannel=e=>setDC(n,P,e.channel);
if(init)setDC(n,P,pc.createDataChannel('tsm'));return P}

async function p2pOffer(n){const P=newPeer(n,true),o=await P.pc.createOffer();await P.pc.setLocalDescription(o);sig(n,{t:'poffer',sdp:o.sdp})}
function p2pWant(n){if(!srv||!me||n===me||!window.RTCPeerConnection||pdc(n)||!S.users[n]||Date.now()-(lastTry[n]||0)<15000)return;lastTry[n]=Date.now();if(me<n)p2pOffer(n).catch(()=>{});else sig(n,{t:'pwant'})}

L.out.forEach(o=>{if(o.sent&&pdc(o.n)&&Date.now()-o.sent>6000)o.sent=0});
t.forEach(n=>{if(!S.users[n])return;if(pdc(n))push(n);else{if(online(n))p2pWant(n);push(n)}})}
function closePeers(){Object.values(peers).forEach(p=>{try{p.pc.close()}catch{}});for(const k in peers)delete peers[k]}
const strip=m=>({id:m.id,u:m.u,t:m.t,ts:m.ts,...(m.img?{img:m.img}:{}),...(m.ctl?{ctl:m.ctl}:{})});
function enqueue(c,m,to){if(!srv)return;to=to||c.members.filter(x=>x!==me);
to.forEach(n=>L.out.push({n,id:m.id,p:{k:'msg',oid:m.id,chat:c.id,type:c.type,name:c.name,owner:c.owner,members:[...c.members],m:strip(m)}}));
if(L.out.length>1500)L.out.splice(0,L.out.length-1500);persist();to.forEach(push)}
function sendTo(n,p){const dc=pdc(n);if(dc){try{dc.send(JSON.stringify(p));return true}catch{}}
if(!srv)return false;fetch(API+'?a=relay',{method:'POST',body:JSON.stringify({to:n,from:me,p})}).catch(()=>{});return true}
function push(n){const dc=pdc(n);if(!dc&&online(n))p2pWant(n);
for(const o of L.out){if(o.n!==n)continue;
if(dc){if(!o.sent){try{dc.send(JSON.stringify(o.p));o.sent=Date.now()}catch{}}}
else if(srv&&(!o.sent||Date.now()-o.sent>RELAY_MS)){o.sent=Date.now();fetch(API+'?a=relay',{method:'POST',body:JSON.stringify({to:n,from:me,p:o.p})}).then(r=>{if(!r.ok)o.sent=0}).catch(()=>{o.sent=0})}}}

let call=null,rg=null;const ICE={iceServers:[{urls:'stun:stun.l.google.com:19302'},{urls:'stun:stun1.l.google.com:19302'}]};
const sig=(to,m)=>fetch(API+'?a=sig',{method:'POST',body:JSON.stringify({to,m:{...m,from:me}})}).catch(()=>{});
function ring(on){clearInterval(rg);rg=null;if(!on)return;const b=()=>{try{const a=ring.a??=new AudioContext(),o=a.createOscillator(),g=a.createGain();o.frequency.value=820;g.gain.value=.08;o.connect(g);g.connect(a.destination);o.start();o.stop(a.currentTime+.25);SET.vib&&navigator.vibrate&&navigator.vibrate([250,150,250])}catch{}};b();rg=setInterval(b,2000)}
function callUI(st,inc){const c=$('#call');c.classList.add('on');$('#cn').textContent=call.peer;$('#cav').textContent=call.peer[0].toUpperCase();$('#cs').textContent=st;
$('#lv').style.display=call.video&&call.ls?'block':'none';if(call.ls)$('#lv').srcObject=call.ls;
$('#cbt').innerHTML=inc?'<button class="grn" data-c="acc">📞</button><button class="red" data-c="end">✕</button>':`<button class="g" data-c="mic">🎤</button>${call.video?'<button class="g" data-c="cam">📷</button>':''}<button class="red" data-c="end">☎</button>`}
$('#cbt').onclick=e=>{const b=e.target.closest('[data-c]');if(!b||!call)return;const c=b.dataset.c;
if(c==='acc')acceptCall();else if(c==='end')endCall(true);
else if(c==='mic'){call.ls.getAudioTracks().forEach(t=>t.enabled=!t.enabled);b.style.opacity=b.style.opacity==='.4'?'1':'.4'}
else if(c==='cam'){call.ls.getVideoTracks().forEach(t=>t.enabled=!t.enabled);b.style.opacity=b.style.opacity==='.4'?'1':'.4'}};
function mkpc(){const pc=new RTCPeerConnection(ICE);call.pc=pc;call.ls.getTracks().forEach(t=>pc.addTrack(t,call.ls));
pc.onicecandidate=e=>{if(e.candidate&&call)sig(call.peer,{t:'ice',c:e.candidate})};
pc.ontrack=e=>{if($('#rv').srcObject!==e.streams[0])$('#rv').srcObject=e.streams[0]};
pc.onconnectionstatechange=()=>{if(!call||call.pc!==pc)return;const s=pc.connectionState;
if(s==='connected'){ring(false);call.t0=call.t0||Date.now();clearInterval(call.iv);call.iv=setInterval(()=>{const d=Math.floor((Date.now()-call.t0)/1000);$('#cs').textContent='Разговор '+String(Math.floor(d/60)).padStart(2,'0')+':'+String(d%60).padStart(2,'0')},1000)}
if(s==='failed'||s==='closed'){toast('Соединение потеряно');endCall(true)}}}
const media=v=>navigator.mediaDevices.getUserMedia({audio:true,video:v?{facingMode:'user'}:false});
async function startCall(peer,video){if(!can('calls'))return denied();if(!srv)return toast('Звонки работают, только когда сервер подключён');if(call)return toast('Вы уже в звонке');
if(!navigator.mediaDevices)return toast('Звонки требуют HTTPS');
try{const ls=await media(video);call={peer,video,ls,q:[],out:1};mkpc();callUI('Звоним…');ring(true);const o=await call.pc.createOffer();await call.pc.setLocalDescription(o);sig(peer,{t:'offer',sdp:o.sdp,video});
const c=call;setTimeout(()=>{if(call===c&&!c.t0){toast('Нет ответа');endCall(true)}},45000)}catch{endCall(false);toast('Нет доступа к микрофону или камере')}}
async function acceptCall(){ring(false);try{call.ls=await media(call.video);mkpc();await call.pc.setRemoteDescription({type:'offer',sdp:call.offer.sdp});for(const c of call.q)await call.pc.addIceCandidate(c).catch(()=>{});call.q=[];
const a=await call.pc.createAnswer();await call.pc.setLocalDescription(a);sig(call.peer,{t:'answer',sdp:a.sdp});callUI('Соединяем…')}catch{toast('Нет доступа к микрофону или камере');endCall(true)}}
function endCall(notify){ring(false);if(!call){$('#call').classList.remove('on');return}const c=call;call=null;if(notify)sig(c.peer,{t:'bye'});clearInterval(c.iv);
try{c.ls&&c.ls.getTracks().forEach(t=>t.stop());c.pc&&c.pc.close()}catch{}$('#rv').srcObject=null;$('#lv').srcObject=null;$('#call').classList.remove('on')}
async function onSig(m){
if(m.t==='pwant'){if(me<m.from)p2pOffer(m.from).catch(()=>{});return}
if(m.t==='poffer'){if(!S.users[m.from])return;try{const P=newPeer(m.from,false);await P.pc.setRemoteDescription({type:'offer',sdp:m.sdp});const a=await P.pc.createAnswer();await P.pc.setLocalDescription(a);sig(m.from,{t:'panswer',sdp:a.sdp});for(const c of P.q)await P.pc.addIceCandidate(c).catch(()=>{});P.q=[]}catch{}return}
if(m.t==='panswer'){const P=peers[m.from];if(P&&P.pc.signalingState==='have-local-offer'){try{await P.pc.setRemoteDescription({type:'answer',sdp:m.sdp});for(const c of P.q)await P.pc.addIceCandidate(c).catch(()=>{});P.q=[]}catch{}}return}
if(m.t==='pice'){const P=peers[m.from];if(!P)return;if(P.pc.remoteDescription)P.pc.addIceCandidate(m.c).catch(()=>{});else P.q.push(m.c);return}
if(m.t==='offer'){if(call||!S.users[m.from]||!can('calls')){sig(m.from,{t:'bye'});return}call={peer:m.from,video:m.video,q:[],offer:m};callUI(m.video?'Входящий видеозвонок':'Входящий звонок',true);ring(true);return}
if(!call||m.from!==call.peer)return;
if(m.t==='answer'){ring(false);try{await call.pc.setRemoteDescription({type:'answer',sdp:m.sdp});for(const c of call.q)await call.pc.addIceCandidate(c).catch(()=>{});call.q=[]}catch{}}
else if(m.t==='ice'){if(call.pc&&call.pc.remoteDescription)call.pc.addIceCandidate(m.c).catch(()=>{});else call.q.push(m.c)}
else if(m.t==='bye'){endCall(false);toast('Звонок завершён')}}
